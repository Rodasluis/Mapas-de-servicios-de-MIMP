<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mapas imprimibles del MIMP</title>
    <meta
      name="description"
      content="Generador de mapas de los servicios del MIMP listos para imprenta, en PDF vectorial."
    />
  </head>
  <body class="cargando">
    <a class="saltar" href="#vista">Saltar a la vista previa</a>

    <header class="cabecera">
      <h1>Mapas imprimibles del MIMP</h1>
      <p class="entradilla">
        Configura el mapa, revísalo en pantalla y descárgalo en PDF vectorial listo para
        imprenta.
      </p>
    </header>

    <p id="arranque" class="fallo" hidden></p>

    <main class="disposicion">
      <form id="panel" class="panel" aria-label="Configuración del mapa"></form>

      <section class="area-vista" aria-label="Vista previa">
        <div class="barra-vista">
          <div class="controles-zoom" role="group" aria-label="Zoom de la vista previa">
            <button type="button" id="alejar" aria-label="Alejar">−</button>
            <span id="nivel-zoom" aria-live="off">100 %</span>
            <button type="button" id="acercar" aria-label="Acercar">+</button>
            <button type="button" id="ajustar">Ajustar</button>
          </div>
          <button type="button" id="copiar-enlace" class="enlace">
            <span>Copiar enlace de esta configuración</span>
          </button>
        </div>

        <div id="vista" class="vista" role="img"
             aria-label="Vista previa del mapa. Usa las flechas para desplazar, + y − para el zoom, 0 para ajustar."></div>

        <div class="informes">
          <dl id="resumen" class="resumen"></dl>
          <div id="bloque-avisos" hidden>
            <h2>Avisos</h2>
            <ul id="avisos" class="avisos"></ul>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
