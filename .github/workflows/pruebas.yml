# Controles de calidad en cada pull request, y antes de publicar en Pages.
#
# Lo que se comprueba aquí es lo mismo que en local, con los mismos comandos: no hay
# una versión «de CI» del control que pudiera pasar mientras la de verdad falla.
#
# No se dispara en los empujones a main: ahí lo llama el despliegue (`workflow_call`),
# que no publica si esto no pasa. Si se disparara además por su cuenta, el mismo empujón
# descargaría dos veces los 95 MB para comprobar lo mismo.
#
# La preparación descarga unos 95 MB de cartografía y tipografías desde orígenes
# anclados a una versión concreta. Se cachean por el contenido de package.json, que es
# donde viven esas versiones: mientras no cambie un TAG, no se vuelve a descargar nada.
name: Pruebas

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Un pull request que recibe varios empujones seguidos sólo comprueba el último.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Chromium compone las muestras y rasteriza los PDF; sin él no hay control alguno.
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Cachear los datos preparados
        uses: actions/cache@v6
        with:
          path: |
            .cache
            public/data
            public/fonts
          key: datos-${{ hashFiles('package.json', 'scripts/fetch-*.mjs', 'scripts/build-geo.mjs') }}

      - name: Preparar los datos
        run: npm run preparar

      - name: Construir el sitio
        run: npm run build

      # Totales por tipo y ámbito, superposiciones, escala gráfica, vectorialidad, y la
      # comprobación de que el PDF descargado desde la web es idéntico al del banco.
      - name: Muestras y comprobaciones estructurales
        run: npm run muestras -- --fecha=2026-01-01

      # Regresión visual contra las firmas aprobadas, más el informe de rendimiento.
      - name: Control de calidad
        run: npm run qa

      # Si algo no cuadra, las láminas y los mapas de diferencias se pueden descargar y
      # mirar: «la firma cambió» no es accionable sin ver qué cambió.
      - name: Guardar las láminas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: muestras
          path: |
            muestras/*.pdf
            muestras/informe.json
            muestras/regresion/*.png
          retention-days: 14
